name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  python-lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Pull Git LFS task snapshots
        run: git lfs pull
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
      - name: Set up Go (for Go task validation)
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Set up Node (for TypeScript task validation)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up Rust (for Rust task validation)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.87.0"
          components: clippy, rustfmt
      - name: Install cargo-audit
        # A prebuilt release binary (the same pinned version) instead of
        # `cargo install`, which compiled it from source for about 2 minutes
        # on every run.
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.21.2
      - name: Set up Java (for Java analyzer smoke + future tasks)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install uv or pip deps (use venv + make for parity)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test]"
      - name: Ruff lint + format check
        run: ruff check . && ruff format --check .
      - name: No em-dashes (U+2014) in authored written text
        run: python scripts/check_no_emdash.py
      - name: Frozen suites match their locks (tasks/*/suite.lock.json)
        run: python -m harness.suite_lock check
      - name: Mypy typecheck
        run: mypy harness backend alembic/env.py scripts/ingest_runs.py
      - name: Pytest (fast, no Docker)
        # -n auto spreads the tests over every core on the runner (pytest-xdist);
        # pytest-cov combines the workers' coverage before the 80% gate.
        run: pytest -n auto -m "not slow and not docker" --cov=harness --cov-fail-under=80
      - name: Does this change touch task grading?
        # Task validation re-grades every tasks/v1 task (about 4.5 minutes). It
        # can only change when the tasks or the code that grades them change,
        # so pull requests that touch neither (results, docs, scripts) skip it.
        # The Validate Tasks workflow also covers tasks/ changes. Pushes to main
        # always validate.
        id: grading
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "validate=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Paginated file list (gh pr diff fails above 300 files). If GitHub cannot
          # list them, or the PR is at the API's 3000-file limit, run the check.
          if ! files=$(gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename'); then
            echo "Could not list the PR's files; running the check."; echo "validate=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$(printf '%s\n' "$files" | wc -l)" -ge 3000 ]; then
            echo "validate=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if grep -qE '^(tasks/|harness/|sandbox/|scripts/validate_tasks\.py$|pyproject\.toml$|\.github/workflows/ci\.yml$)' <<< "$files"; then
            echo "validate=true" >> "$GITHUB_OUTPUT"
          else
            echo "validate=false" >> "$GITHUB_OUTPUT"
            echo "No task or grading change in this PR; task validation skipped."
          fi
      - name: Validate tasks (gold patches solve, fail-to-pass real, deterministic)
        if: steps.grading.outputs.validate == 'true'
        run: python scripts/validate_tasks.py tasks/v1

  python-3-14-smoke:
    # Deliberately light: the main job pins 3.12 and carries every toolchain;
    # this one only proves the pure-Python layer installs and runs on the
    # newest CPython. It exists because audioop left the stdlib in 3.13 and
    # took every `vulcanbench` command down with it on 3.13+ until the
    # audioop-lts marker dep landed -- a class of bug 3.12-only CI can't see.
    # No LFS, no Go/Node/Rust/Java, no ruff/mypy (enforced on 3.12 already),
    # no coverage gate (same number as the main job), no task validation.
    # It normally takes about 10 minutes; fail a stuck run well before the
    # 6-hour default.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: 'pip'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: CLI imports and starts
        run: vulcanbench --version && vulcanbench --help
      - name: Pytest (fast, no Docker, no coverage gate)
        run: pytest -n auto -m "not slow and not docker" --no-cov -p no:cacheprovider

  dashboard-lint-build:
    runs-on: ubuntu-latest
    steps:
      - name: Does this change touch the dashboard?
        # The dashboard (dashboard/, the local GUI) only needs checking when it
        # or this workflow changes, so other pull requests skip the steps below
        # and the job reports success. Pushes to main always check it.
        id: dashboard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "check=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Paginated file list (gh pr diff fails above 300 files). If GitHub cannot
          # list them, or the PR is at the API's 3000-file limit, run the check.
          if ! files=$(gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename'); then
            echo "Could not list the PR's files; running the check."; echo "check=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$(printf '%s\n' "$files" | wc -l)" -ge 3000 ]; then
            echo "check=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if grep -qE '^(dashboard/|\.github/workflows/ci\.yml$)' <<< "$files"; then
            echo "check=true" >> "$GITHUB_OUTPUT"
          else
            echo "check=false" >> "$GITHUB_OUTPUT"
            echo "No dashboard change in this PR; dashboard lint and build skipped."
          fi
      - uses: actions/checkout@v4
        if: steps.dashboard.outputs.check == 'true'
      - name: Set up Node 22
        if: steps.dashboard.outputs.check == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dashboard deps
        if: steps.dashboard.outputs.check == 'true'
        run: cd dashboard && npm ci
      - name: Lint dashboard
        if: steps.dashboard.outputs.check == 'true'
        run: cd dashboard && npm run lint
      - name: Build dashboard
        if: steps.dashboard.outputs.check == 'true'
        run: cd dashboard && npm run build

  desktop-test:
    # The Mac app's helpers (desktop/lib) are plain node; the Electron binary
    # is not needed for them, so its download is skipped.
    runs-on: ubuntu-latest
    steps:
      - name: Does this change touch the Mac app?
        # Same rule as the dashboard: only when desktop/ or this workflow
        # changes on a pull request; pushes to main always test it.
        id: desktop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "check=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Paginated file list (gh pr diff fails above 300 files). If GitHub cannot
          # list them, or the PR is at the API's 3000-file limit, run the check.
          if ! files=$(gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename'); then
            echo "Could not list the PR's files; running the check."; echo "check=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$(printf '%s\n' "$files" | wc -l)" -ge 3000 ]; then
            echo "check=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if grep -qE '^(desktop/|\.github/workflows/ci\.yml$)' <<< "$files"; then
            echo "check=true" >> "$GITHUB_OUTPUT"
          else
            echo "check=false" >> "$GITHUB_OUTPUT"
            echo "No Mac app change in this PR; desktop tests skipped."
          fi
      - uses: actions/checkout@v4
        if: steps.desktop.outputs.check == 'true'
      - name: Set up Node 22
        if: steps.desktop.outputs.check == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json
      - name: Install desktop deps (no Electron download)
        if: steps.desktop.outputs.check == 'true'
        run: cd desktop && ELECTRON_SKIP_BINARY_DOWNLOAD=1 npm ci --no-audit --no-fund
      - name: Test desktop helpers
        if: steps.desktop.outputs.check == 'true'
        run: cd desktop && npm test

  docker-sandbox-build:
    runs-on: ubuntu-latest
    steps:
      - name: Does this change touch the sandbox images?
        # The Dockerfiles copy nothing from the rest of the repository, so the
        # images can only change when sandbox/ or this workflow changes; other
        # pull requests skip the build and the job reports success. Pushes to
        # main always build.
        id: sandbox
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "check=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Paginated file list (gh pr diff fails above 300 files). If GitHub cannot
          # list them, or the PR is at the API's 3000-file limit, run the check.
          if ! files=$(gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename'); then
            echo "Could not list the PR's files; running the check."; echo "check=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$(printf '%s\n' "$files" | wc -l)" -ge 3000 ]; then
            echo "check=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if grep -qE '^(sandbox/|\.github/workflows/ci\.yml$)' <<< "$files"; then
            echo "check=true" >> "$GITHUB_OUTPUT"
          else
            echo "check=false" >> "$GITHUB_OUTPUT"
            echo "No sandbox change in this PR; image build skipped."
          fi
      - uses: actions/checkout@v4
        if: steps.sandbox.outputs.check == 'true'
      - name: Build sandbox base image
        if: steps.sandbox.outputs.check == 'true'
        run: docker build -t vulcanbench/sandbox:base -f sandbox/Dockerfile.base .
      - name: Smoke sandbox toolchains
        if: steps.sandbox.outputs.check == 'true'
        # Use `sh -c`, not `sh -lc`: a login shell re-sources /etc/profile and
        # resets PATH, dropping the image's /usr/local/go/bin (Go lives there).
        run: |
          docker run --rm vulcanbench/sandbox:base sh -c '
            python --version &&
            pytest --version &&
            ruff --version &&
            bandit --version &&
            radon --version &&
            go version &&
            node --version
          '
      - name: Build Rust sandbox image
        if: steps.sandbox.outputs.check == 'true'
        run: docker build -t vulcanbench/sandbox:rust -f sandbox/Dockerfile.rust .
      - name: Smoke Rust sandbox toolchains
        if: steps.sandbox.outputs.check == 'true'
        # `sh -c` for the same reason as above: the cargo toolchain lives on
        # /usr/local/cargo/bin, which a login shell would drop from PATH.
        run: |
          docker run --rm vulcanbench/sandbox:rust sh -c '
            rustc --version &&
            cargo --version &&
            cargo clippy --version &&
            cargo fmt --version &&
            cargo audit --version
          '
