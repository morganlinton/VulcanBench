repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: no-emdash
        name: no em-dashes (U+2014) in written text
        entry: python scripts/check_no_emdash.py
        language: system
        pass_filenames: true
