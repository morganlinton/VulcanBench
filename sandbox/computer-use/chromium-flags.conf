# Sourced by Debian's /usr/bin/chromium wrapper. computer-1 passes its own
# command line (harbor/agents/computer_1/runtime.py); these flags are appended
# to every launch so screenshots are deterministic: no motion, no LCD text,
# no background network traffic.
export CHROMIUM_FLAGS="$CHROMIUM_FLAGS --force-device-scale-factor=1 --force-prefers-reduced-motion --disable-smooth-scrolling --font-render-hinting=none --disable-lcd-text --disable-background-networking --disable-component-update --disable-sync --no-pings --password-store=basic --hide-crash-restore-bubble --disable-features=TranslateUI,MediaRouter"
