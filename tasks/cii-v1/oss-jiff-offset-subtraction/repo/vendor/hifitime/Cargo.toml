[[test]]
name = "lib"
path = "tests/lib.rs"

[[test]]
name = "polynomial"
path = "tests/polynomial.rs"

[[test]]
name = "timescale"
path = "tests/timescale.rs"

[[test]]
name = "timeseries"
path = "tests/timeseries.rs"

[[test]]
name = "ut1"
path = "tests/ut1.rs"

[[test]]
name = "weekday"
path = "tests/weekday.rs"

[[bench]]
name = "crit_duration"
path = "benches/crit_duration.rs"
harness = false

[[bench]]
name = "crit_epoch"
path = "benches/crit_epoch.rs"
harness = false

[[bench]]
name = "iai_duration"
