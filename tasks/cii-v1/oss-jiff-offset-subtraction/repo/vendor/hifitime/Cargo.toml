[package]
edition = "2021"
name = "hifitime"
version = "4.3.1"
authors = ["Christopher Rabotin <christopher.rabotin@gmail.com>"]
build = false
exclude = [
    "*.tar.gz",
    "data/",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Ultra-precise date and time handling in Rust for scientific applications with leap second support"
homepage = "https://nyxspace.com/"
documentation = "https://docs.rs/hifitime/"
readme = "README.md"
keywords = [
    "date",
    "time",
    "science",
    "leap-second",
    "no-std",
]
categories = [
    "date-and-time",
    "no-std",
]
license = "MPL-2.0"
repository = "https://github.com/nyx-space/hifitime"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "--cfg",
    "docrs",
    "--generate-link-to-definition",
]

[features]
default = ["std"]
lts = [
    "std",
    "ureq",
    "ut1",
]
python = [
    "std",
    "pyo3/extension-module",
    "ut1",
    "lts",
]
std = [
    "serde",
    "serde_derive",
    "web-time",
    "snafu/std",
    "snafu/backtrace",
]
ut1 = [
    "std",
    "ureq",
    "tabled",
]

[lib]
name = "hifitime"
crate-type = ["rlib"]
path = "src/lib.rs"

[[test]]
name = "duration"
path = "tests/duration.rs"

[[test]]
name = "efmt"
path = "tests/efmt.rs"

[[test]]
name = "epoch"
